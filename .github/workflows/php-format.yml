name: PHP formatting

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format-check:
    name: PHP format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP and PHP CS Fixer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: php-cs-fixer:3.95.27

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Check PHP formatting
        run: just test
